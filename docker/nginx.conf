worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	# Godot's web export ships a .wasm module; the stock mime.types in some
	# images predates it, and the wrong type stops streaming compilation.
	types {
		application/wasm wasm;
	}
	default_type application/octet-stream;
	access_log /dev/stdout;

	sendfile on;
	tcp_nopush on;
	gzip on;
	gzip_types application/javascript application/wasm application/json text/css text/plain image/svg+xml;
	gzip_min_length 1024;

	# Writable paths for the unprivileged user.
	client_body_temp_path /tmp/client_body;
	proxy_temp_path /tmp/proxy;
	fastcgi_temp_path /tmp/fastcgi;
	uwsgi_temp_path /tmp/uwsgi;
	scgi_temp_path /tmp/scgi;

	server {
		listen 8080;
		server_name _;
		root /usr/share/nginx/html;
		index index.html;

		# The engine and pack are content-hashed by release, the shell is not.
		location ~* \.(wasm|pck)$ {
			expires 30d;
			add_header Cache-Control "public, immutable";
		}
		location = /index.html {
			add_header Cache-Control "no-cache";
		}

		location /healthz {
			access_log off;
			return 200 "ok\n";
		}

		location / {
			try_files $uri $uri/ /index.html;
		}
	}
}

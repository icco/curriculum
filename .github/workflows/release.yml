name: Release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
env:
  GODOT_VERSION: 4.7.1
permissions:
  contents: read
jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot binary and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-templates

      - name: Install Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: ./tools/ci-install-godot.sh --with-templates

      - name: Verify tests pass before publishing
        run: GODOT=~/godot-bin/godot ./tools/check.sh

      - name: Export release builds
        run: |
          godot=~/godot-bin/godot
          "$godot" --headless --import --path . 2>&1 | tail -3
          mkdir -p build/web build/linux
          "$godot" --headless --path . \
            --export-release Web build/web/index.html
          "$godot" --headless --path . \
            --export-release Linux build/linux/loopwood-high.x86_64

      - name: Package
        run: |
          mkdir -p dist
          (cd build/web && zip -qr ../../dist/loopwood-high-web.zip .)
          (cd build/linux && tar czf ../../dist/loopwood-high-linux-x86_64.tar.gz .)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist
          if-no-files-found: error

      - name: Upload web build for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-dist
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pages:
    name: Deploy playable web build
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

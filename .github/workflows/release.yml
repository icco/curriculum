name: Release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
env:
  GODOT_VERSION: 4.7.2
permissions:
  contents: read
jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Godot binary and export templates
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-templates

      - name: Install Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: ./tools/ci-install-godot.sh --with-templates

      - name: Verify tests pass before publishing
        run: GODOT=~/godot-bin/godot ./tools/check.sh

      - name: Export release builds
        run: |
          godot=~/godot-bin/godot
          "$godot" --headless --import --path . 2>&1 | tail -3
          mkdir -p build/web build/linux
          "$godot" --headless --path . \
            --export-release Web build/web/index.html
          "$godot" --headless --path . \
            --export-release Linux build/linux/curriculum.x86_64

      - name: Package
        run: |
          mkdir -p dist
          (cd build/web && zip -qr ../../dist/curriculum-web.zip .)
          (cd build/linux && tar czf ../../dist/curriculum-linux-x86_64.tar.gz .)
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist
          if-no-files-found: error

      - name: Upload web build for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

  pages:
    name: Deploy playable web build
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
